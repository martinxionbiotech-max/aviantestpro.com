site_name: SENO Avian Genetic Test — Technical Documentation Center
site_description: >
  Official SENO Testing Center technical documentation knowledge base providing
  avian DNA sexing protocols, PCR disease detection panels for PBFD/APV/AIV,
  racing pigeon genetic testing, laboratory SOPs, sample collection guides,
  and regulatory compliance references for bird breeders and veterinary professionals.
site_author: Zhangjiakou SENO Testing Center Co., Ltd.
site_url: https://data.aviantestpro.com

theme:
  name: material
  language: en
  custom_dir: overrides/
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra:
  generator: false
  social: []

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
      toc_depth: 2-4

plugins:
  - glightbox
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
        remove_empty_space: true

